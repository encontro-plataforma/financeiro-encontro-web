<mat-form-field appearance="outline" class="arquivo-nome-field no-hint">
  <mat-label>Nome do Arquivo</mat-label>
  <input matInput [value]="upload.nome_arquivo" readonly />
</mat-form-field>

@if (temErro && upload.error_code) {
  <div class="erro-box">
    <mat-icon>error_outline</mat-icon>
    <div>
      <p class="erro-codigo">{{ upload.error_code }}</p>
      <textarea class="erro-mensagem" readonly rows="6">{{ upload.error_message }}</textarea>
    </div>
  </div>
}

<app-upload-totais-cards
  [totais]="resumo"
  [tabelaAtiva]="tabelaAtiva"
  (selecionar)="tabelaAtiva = $event" />

@if (temErro && tabelaAtiva === 'erros') {
  <app-upload-erros-table [erros]="errosDetalhados" />
} @else if (temDuplicados && tabelaAtiva === 'duplicados') {
  <app-upload-duplicados-table [duplicados]="duplicadosDetalhados" />
} @else if (!resumo.length) {
  <p class="sem-resumo">Ainda não há um resumo disponível para este arquivo.</p>
}
