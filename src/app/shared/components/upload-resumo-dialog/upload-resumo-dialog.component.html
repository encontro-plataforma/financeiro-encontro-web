<h2 mat-dialog-title>Resumo do processamento</h2>

<mat-dialog-content class="resumo-content">
  <p class="arquivo-nome">{{ arquivo.nome_arquivo }}</p>

  @if (temErro) {
    <div class="erro-box">
      <mat-icon>error_outline</mat-icon>
      <div>
        <p class="erro-codigo">{{ arquivo.error_code }}</p>
        <textarea class="erro-mensagem" readonly rows="6">{{ arquivo.error_message }}</textarea>
      </div>
    </div>
  } @else if (resumo.length) {
    <dl class="resumo-lista">
      @for (item of resumo; track item.chave) {
        <dt>{{ item.chave }}</dt>
        <dd>{{ item.valor }}</dd>
      }
    </dl>
  } @else {
    <p class="sem-resumo">Ainda não há um resumo disponível para este arquivo.</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="fechar()">Fechar</button>
</mat-dialog-actions>
