<h2 mat-dialog-title>Selecionar lançamento</h2>

<mat-dialog-content class="picker-content">

  <mat-form-field appearance="outline" floatLabel="always" class="w-full">
    <mat-label>Buscar por descrição</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [(ngModel)]="search" (ngModelChange)="onSearchChange()" placeholder="Descrição do lançamento..." />
  </mat-form-field>

  @if (loading) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-table [dataSource]="result.items" class="picker-table">

    <ng-container matColumnDef="data_pagamento">
      <mat-header-cell *matHeaderCellDef>Data</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.data_pagamento | date:'dd/MM/yyyy' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <mat-header-cell *matHeaderCellDef>Descrição</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.descricao }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="valor">
      <mat-header-cell *matHeaderCellDef>Valor</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.valor | currency:'BRL' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ statusLabel(row.status) }}</mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns" />
    <mat-row *matRowDef="let row; columns: displayedColumns;" class="picker-row" (click)="selecionar(row)" />

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">
        @if (!loading) {
          <span>Nenhum lançamento encontrado</span>
        }
      </td>
    </tr>

  </mat-table>

  <mat-paginator
    [length]="result.total"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[8, 16, 24]"
    (page)="onPage($event)" />

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancelar()">Cancelar</button>
</mat-dialog-actions>
