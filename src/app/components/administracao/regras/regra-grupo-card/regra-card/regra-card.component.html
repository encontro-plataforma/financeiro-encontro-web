<mat-card appearance="outlined" class="regra-card" [class.regra-card--inativa]="!regra.ativo">
  <div class="regra-card__topo">
    <div class="regra-card__ordem">
      <button mat-icon-button [disabled]="primeira" matTooltip="Mover para cima" (click)="subir.emit()">
        <mat-icon>keyboard_arrow_up</mat-icon>
      </button>
      <button mat-icon-button [disabled]="ultima" matTooltip="Mover para baixo" (click)="descer.emit()">
        <mat-icon>keyboard_arrow_down</mat-icon>
      </button>
    </div>

    <div class="regra-card__titulo">
      <div class="regra-card__nome">
        {{ regra.nome }}
        @if (!regra.ativo) {
          <span class="regra-card__badge-inativa">inativa</span>
        }
      </div>
      <div class="regra-card__subtitulo">Gera Detalhamento de: {{ tipoDescricao }}</div>
    </div>
  </div>

  <div class="regra-card__condicoes">
    @if (regra.condicoes.length) {
      @for (condicao of regra.condicoes; track $index) {
        <div class="regra-card__condicao-item">{{ condicao.padrao_regex }}</div>
      }
    } @else {
      <span class="regra-card__sem-condicao">Nenhuma condição configurada.</span>
    }

    <span class="regra-card__spacer"></span>

    <button mat-icon-button class="btn" matTooltip="Editar regra" (click)="editar.emit()">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button class="btn" matTooltip="Gerenciar condições" (click)="gerenciarCondicoes.emit()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="regra-card__rodape">
    <button mat-icon-button color="warn" class="btn" matTooltip="Excluir regra" (click)="excluir.emit()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</mat-card>
